<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Beat</title><link rel="stylesheet" href="../shared.css"><style>.memory-card{text-align:center}.pads{display:grid;grid-template-columns:repeat(2,minmax(100px,155px));justify-content:center;gap:13px;margin:24px auto}.pad{height:133px;border:0;border-radius:26px;opacity:.72;box-shadow:inset 0 -6px #00000012,0 8px 18px #19291b12;transition:transform .12s,opacity .12s,filter .12s;touch-action:manipulation}.pad:hover{opacity:.9}.pad:active,.pad.lit{opacity:1;filter:brightness(1.25);transform:scale(1.04);box-shadow:0 0 30px currentColor,inset 0 -4px #00000010}.pad:disabled{cursor:default}.pad[data-i="0"]{background:#e87872;color:#e87872}.pad[data-i="1"]{background:#69ad83;color:#69ad83}.pad[data-i="2"]{background:#729bd4;color:#729bd4}.pad[data-i="3"]{background:#e5b955;color:#e5b955}.memory-options{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}@media(max-width:500px){.pad{height:102px;border-radius:19px}}</style></head><body><div class="frame">
